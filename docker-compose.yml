# Default: postgres + redis (API on the host: npm run start:dev)
# Full stack: docker compose --profile app up -d --build
# Ansible uses the app profile. APP_VERSION is the Docker image tag (git sha from Jenkins).

name: membership

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: membership-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multitenant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multitenant}
      POSTGRES_DB: ${POSTGRES_DB:-multitenant_membership}
    volumes:
      - membership_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multitenant} -d ${POSTGRES_DB:-multitenant_membership}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - membership

  redis:
    image: redis:7.4-alpine
    container_name: membership-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - membership_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - membership

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: membership-api:${APP_VERSION:-0.1.0}
    container_name: membership-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8000}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://membership_app:${POSTGRES_PASSWORD:-multitenant}@postgres:5432/${POSTGRES_DB:-multitenant_membership}?schema=public
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER:-multitenant}:${POSTGRES_PASSWORD:-multitenant}@postgres:5432/${POSTGRES_DB:-multitenant_membership}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - membership

networks:
  membership:
    name: membership-net
    driver: bridge

volumes:
  membership_pg_data:
  membership_redis_data:
